name: .NET

on:
  pull_request:
    branches: [ master-11 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    strategy:
      matrix:
        versions: [ 11.0.13, 11.1.5, 11.2.8 , 11.3.17 ]

    steps:
    - uses: actions/checkout@v2
      with:
          submodules: 'true'

    - name: Clean
      run: dotnet clean
      env:
        AVA_VER: ${{ matrix.versions }}
    - name: Restore
      run: dotnet restore
      env:
        AVA_VER: ${{ matrix.versions }}
    - name: Build
      run: dotnet build --no-restore
      env:
        AVA_VER: ${{ matrix.versions }}
    - name: Test
      run: dotnet test --no-build --verbosity normal
      env:
        AVA_VER: ${{ matrix.versions }}
